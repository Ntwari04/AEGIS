name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegisops/shared-types build
      - run: pnpm --filter @aegisops/api exec prisma generate
      - run: pnpm lint
      - name: Unit tests (guards, authz rules, compose security invariants)
        run: pnpm --filter @aegisops/api test
      - name: Integration tests (real Postgres + real Keycloak via Testcontainers)
        run: pnpm --filter @aegisops/api test:integration

  # Phase 4: the monitoring configuration is validated with the tools that will run it, and every default alert rule
  # is unit-tested (promtool) so a wrong expression cannot ship silently.
  monitoring-config:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.1
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and rules are valid
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/monitoring/prometheus:/p:ro" "$PROMETHEUS_IMAGE" test rules /p/tests/aegisops.rules.test.yml
      - name: Alertmanager config renders and is valid (Slack, email and no channel)
        run: |
          render='sed "s#^exec .*#true#" /etc/alertmanager/entrypoint.sh > /tmp/e.sh && sh /tmp/e.sh && amtool check-config /tmp/alertmanager.yml'
          docker run --rm -e ALERT_SLACK_WEBHOOK_URL=https://hooks.invalid/T/B/x -v "$PWD/infra/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint sh "$ALERTMANAGER_IMAGE" -c "$render"
          docker run --rm -e ALERT_EMAIL_TO=ops@example.com -e ALERT_SMTP_HOST=smtp.example.com -e ALERT_SMTP_PASSWORD=x -v "$PWD/infra/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint sh "$ALERTMANAGER_IMAGE" -c "$render"
          docker run --rm -v "$PWD/infra/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint sh "$ALERTMANAGER_IMAGE" -c "$render"
      - name: Loki and Promtail configs are valid
        run: |
          docker run --rm -v "$PWD/infra/monitoring/loki:/c:ro" grafana/loki:3.5.0 -config.file=/c/loki.yml -verify-config
          docker run --rm -v "$PWD/infra/monitoring/promtail:/c:ro" grafana/promtail:3.5.0 -config.file=/c/promtail.yml -check-syntax

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails the build on any high/critical advisory; do not add ignores without a written exception in docs/.
      - run: pnpm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile --target runtime -t aegisops-${{ matrix.app }}:ci .
      - name: Trivy scan (HIGH/CRITICAL fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegisops-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
