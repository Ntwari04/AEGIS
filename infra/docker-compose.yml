networks:
  aegisops-net:
    external: true   # created ahead of time by scripts/03-create-network.sh

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  promtail-positions:
  grafana-data:

# SECURITY INVARIANT (PRD 8.6/8.7): only `nginx` publishes ports to the host.
# postgres, redis, keycloak, api and web are reachable solely on aegisops-net.
# infra/docker-compose.dev.yml adds 127.0.0.1-only ports for local development;
# never pass it on the droplet. CI (apps/api/test/compose-invariants) enforces this.

services:
  nginx:
    image: nginx:stable-alpine
    container_name: aegisops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d   # writable: the entrypoint renders templates/*.template into here on start
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - aegisops-net

  postgres:
    image: postgres:16-alpine
    container_name: aegisops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in infra/.env}
      AEGISOPS_DB_PASSWORD: ${AEGISOPS_DB_PASSWORD:?set in infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in infra/.env}
      AEGIS_BACKUP_DB_PASSWORD: ${AEGIS_BACKUP_DB_PASSWORD:?set in infra/.env (node infra/scripts/ensure-secrets.mjs)}
      AEGIS_PROVISIONER_DB_PASSWORD: ${AEGIS_PROVISIONER_DB_PASSWORD:?set in infra/.env (node infra/scripts/ensure-secrets.mjs)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aegisops-net

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in infra/.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aegisops-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: aegisops-keycloak
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in infra/.env}
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"          # TLS terminates at Nginx; Keycloak is never exposed directly
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"               # management port 9000, not published; scraped by Prometheus
      KC_EVENT_METRICS_USER_ENABLED: "true"    # counts login_error events for the failed-logins alert
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in infra/.env}
      # Substituted into realm-aegisops.json at import time (never committed):
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in infra/.env}
      WEB_ORIGIN: https://${DOMAIN}
      GRAFANA_ORIGIN: https://grafana.${DOMAIN}
      GRAFANA_OAUTH_SECRET: ${GRAFANA_OAUTH_SECRET:?set in infra/.env}
    volumes:
      - ./keycloak/realm-aegisops.json:/opt/keycloak/data/import/realm-aegisops.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port with bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - aegisops-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: aegisops-api:local
    container_name: aegisops-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://aegisops:${AEGISOPS_DB_PASSWORD}@postgres:5432/aegisops
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_ORIGIN: https://${DOMAIN}
      KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/aegisops
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: aegisops-api
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set in infra/.env}
      GITHUB_DEPLOY_WORKFLOW: ${GITHUB_DEPLOY_WORKFLOW:-Build image}
      # Dashboard health data (FR-DASH-3): read from Prometheus / Alertmanager on the internal network
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100                 # project log search (FR-INFRA-2): Loki is internal only
      ALERTMANAGER_URL: http://alertmanager:9093
      GRAFANA_PUBLIC_URL: https://grafana.${DOMAIN}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-0}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/aegis/github-app.pem   # ./secrets/ is mounted read-only below
      # AES-256-GCM key for per-environment secret values: openssl rand -base64 32. Empty = secret storage disabled (fails closed).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
    volumes:
      - ./secrets:/run/secrets/aegis:ro   # GitHub App private key (gitignored, never baked into an image)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    networks:
      - aegisops-net

  # The deployer is the ONLY service with Docker access (docker.sock is root-equivalent on the host).
  # It exposes no port and no HTTP surface; it only consumes the deployment queue. The API container
  # never mounts the socket, so an API compromise cannot start containers directly.
  deployer:
    image: aegisops-api:local
    container_name: aegisops-deployer
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    healthcheck:   # the api image's HEALTHCHECK probes :4000; the worker has no HTTP surface
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    group_add: ["${DOCKER_GID:-999}"]   # numeric gid of the host docker group: stat -c %g /var/run/docker.sock
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aegisops:${AEGISOPS_DB_PASSWORD}@postgres:5432/aegisops
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_ORIGIN: https://${DOMAIN}
      KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/aegisops
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: aegisops-api
      NGINX_CONTAINER: aegisops-nginx
      NGINX_CONF_DIR: /nginx-managed
      DOCKER_NETWORK: aegisops-net
      GHCR_USERNAME: ${GHCR_USERNAME:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-0}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/aegis/github-app.pem   # ./secrets/ is mounted read-only below
      # AES-256-GCM key for per-environment secret values: openssl rand -base64 32. Empty = secret storage disabled (fails closed).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
    volumes:
      - ./secrets:/run/secrets/aegis:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx/conf.d/managed:/nginx-managed   # chown 1000:1000 on the host; Nginx includes *.conf from here
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - aegisops-net

  # ---------------------------------------------------------------------------------------------------------------
  # Monitoring & observability (Phase 4, PRD 6.6). Nothing here publishes a port: Prometheus, Alertmanager, Loki and the
  # exporters are reachable only on aegisops-net; Grafana is reachable only through Nginx at grafana.$DOMAIN, behind Keycloak.
  # ---------------------------------------------------------------------------------------------------------------

  # Read-only view of the Docker API for cAdvisor and Promtail. Only GET on containers/info/version/events is allowed
  # (POST=0, everything else off), so a compromise of either consumer cannot start, stop or create containers.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: aegisops-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      IMAGES: "0"
      NETWORKS: "1"   # read-only metadata Promtail needs for network labels; POST=0 still blocks every write
      VOLUMES: "0"
      EXEC: "0"
      SECRETS: "0"
      SERVICES: "0"
      TASKS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SWARM: "0"
      SYSTEM: "0"
      AUTH: "0"
      DISTRIBUTION: "0"
      NODES: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: ["no-new-privileges:true"]
    networks:
      - aegisops-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aegisops-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    depends_on: [alertmanager]
    networks:
      - aegisops-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: aegisops-alertmanager
    restart: unless-stopped
    # Receivers are rendered from these variables at start-up (monitoring/alertmanager/entrypoint.sh); routing is config.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-587}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    tmpfs: [/tmp]
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    networks:
      - aegisops-net

  # Container metrics (state, restarts, health, CPU, memory) from the Docker API via the read-only docker-proxy.
  # First-party (apps/api/src/exporter.ts): no host mounts, no database, no secrets, and the same on Docker Desktop and Linux.
  container-exporter:
    image: aegisops-api:local
    container_name: aegisops-container-exporter
    restart: unless-stopped
    command: ["node", "dist/exporter.js"]
    healthcheck:   # the api image's HEALTHCHECK probes :4000; the exporter listens on 9102
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9102/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: "9102"
      DOCKER_PROXY_HOST: docker-proxy
      DOCKER_PROXY_PORT: "2375"
      DOCKER_NETWORK: aegisops-net   # report only the platform's own containers, never other workloads on the host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on: [docker-proxy]
    networks:
      - aegisops-net

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: aegisops-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|host/(dev|proc|sys))($|/)
    volumes:
      - /:/host:ro
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    networks:
      - aegisops-net

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: aegisops-blackbox
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - aegisops-net

  loki:
    image: grafana/loki:3.5.0
    container_name: aegisops-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    networks:
      - aegisops-net

  promtail:
    image: grafana/promtail:3.5.0
    container_name: aegisops-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - promtail-positions:/positions
    mem_limit: 128m
    depends_on: [loki, docker-proxy]
    networks:
      - aegisops-net

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aegisops-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in infra/.env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Single sign-on through Keycloak (PRD 8.1): the local login form is off, so there is no second password to manage.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: AegisOps
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: aegisops-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_SECRET:?set in infra/.env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${DOMAIN}/realms/aegisops/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/aegisops/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/aegisops/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      # Project isolation: Loki holds every project's logs, so Grafana is for operators and auditors only. A developer
      # (or anyone with no matching role) is refused at login; developers see their own projects in the AegisOps dashboard.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'platform_admin') && 'Admin' || contains(roles[*], 'devops_engineer') && 'Editor' || contains(roles[*], 'auditor') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    depends_on: [prometheus, loki]
    networks:
      - aegisops-net

  # The data worker: backups, restores, restore drills and retention (Phase 5, PRD 6.7). Like the deployer it has no port and no
  # HTTP surface; it consumes a queue. It holds what the API deliberately does not: the read-everything backup role, the backup
  # encryption key and the object-storage credentials. It does NOT mount the Docker socket.
  data-worker:
    image: aegisops-api:local
    container_name: aegisops-data-worker
    restart: unless-stopped
    command: ["node", "dist/data-worker.js"]
    healthcheck:   # the api image's HEALTHCHECK probes :4000; this process has no HTTP surface
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aegisops:${AEGISOPS_DB_PASSWORD}@postgres:5432/aegisops
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PG_HOST: postgres
      PG_PORT: "5432"
      BACKUP_DB_USER: aegis_backup
      BACKUP_DB_PASSWORD: ${AEGIS_BACKUP_DB_PASSWORD:?set in infra/.env}
      PROVISIONER_DB_USER: aegis_provisioner
      PROVISIONER_DB_PASSWORD: ${AEGIS_PROVISIONER_DB_PASSWORD:?set in infra/.env}
      # Encrypts the DATABASE_URL secret written when a database is provisioned (same key the API uses for environment secrets).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # AES-256-GCM key for backup archives: openssl rand -base64 32. LOSING IT MAKES EVERY BACKUP UNREADABLE: keep a copy off this host.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set in infra/.env}
      BACKUP_RTO_SECONDS: ${BACKUP_RTO_SECONDS:-14400}
      # Off-host object storage (DigitalOcean Spaces, S3, ...). Unset = backups fail loudly and alert; they are never kept on this disk.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - aegisops-net

  # Migrations are an explicit step, never "sync on boot" (PRD 11):
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://aegisops:${AEGISOPS_DB_PASSWORD}@postgres:5432/aegisops
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - aegisops-net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: aegisops-web:local
    container_name: aegisops-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUTH_URL: https://${DOMAIN}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?set in infra/.env}
      KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/aegisops
      KEYCLOAK_CLIENT_ID: aegisops-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      API_URL: http://api:4000/api/v1
    depends_on:
      - api
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks:
      - aegisops-net
