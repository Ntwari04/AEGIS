# LOCAL DEVELOPMENT ONLY. Never use on the droplet.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis keycloak
#
# Lets `pnpm dev` on your machine reach the backing services, and lets your
# browser reach Keycloak at http://localhost:18080 (non-default ports so they do not collide with other local stacks). Everything is bound to
# 127.0.0.1 so nothing is exposed beyond your own machine. Production has no
# published ports other than Nginx 80/443 (PRD 8.6/8.7).

services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  redis:
    ports: ["127.0.0.1:16379:6379"]
  keycloak:
    ports: ["127.0.0.1:18080:8080"]
    environment:
      KC_HOSTNAME: http://localhost:18080
      WEB_ORIGIN: http://localhost:13000
